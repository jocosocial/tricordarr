appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      "-EXDevMenuIsOnboardingFinished": true
- runFlow:
    when:
      platform: iOS
    commands:
    - openLink: "tricordarr://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
    - tapOn: "Close"
- runFlow:
    when:
      platform: Android
    commands:
    - extendedWaitUntil:
        visible: "npx expo start"
        timeout: 30000
    - openLink: "tricordarr://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081%2Findex.bundle%3Fplatform%3Dandroid%26dev%3Dtrue%26minify%3Dfalse%26disableOnboarding%3D1"
    - tapOn: "Close"


