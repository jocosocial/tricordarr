    #       visible: "http://10.0.2.2:8081"
    #       timeout: 60000
    #   - tapOn: "http://10.0.2.2:8081"
    #   - extendedWaitUntil:
    #       visible: "Continue"
    #       timeout: 180000
    #   - tapOn: "Continue"
    #   - back
- extendedWaitUntil:
    visible: "Welcome to Twitarr!"
    timeout: 60000