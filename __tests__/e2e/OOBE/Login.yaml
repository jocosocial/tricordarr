appId: ${APP_ID}
---
- runFlow:
    file: ../SetupApp.yaml
- runFlow:
    file: subflows/ServerSetup.yaml
- tapOn:
    id: "oobeLogIn-button"
- tapOn:
    id: "loginUsername-input"
- inputText: ${TWITARR_USER}
- tapOn:
    id: "loginPassword-input"
- inputText: ${TWITARR_PASSWORD}
- tapOn:
    id: "loginSubmit-button"
# iOS offers to save the password to the keychain.
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    file: subflows/Finish.yaml
